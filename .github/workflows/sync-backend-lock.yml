name: Sync backend lockfile

on:
  push:
    branches: [v1.1]
    paths:
      - Back/package.json
      - .github/workflows/sync-backend-lock.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13
      - name: Generate backend lockfile
        working-directory: Back
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit backend lockfile
        run: |
          if git diff --quiet -- Back/package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Back/package-lock.json
          git commit -m "Update backend dependency lockfile"
          git push origin HEAD:v1.1
