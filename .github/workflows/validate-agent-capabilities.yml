name: Validate Carlos Office runtime

on:
  push:
    branches:
      - main
      - staging/agent-capabilities
      - agent/retention-architecture-v4
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout final source tree
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm
          cache-dependency-path: |
            Back/package-lock.json
            Front/package-lock.json

      - name: Install backend dependencies
        working-directory: Back
        run: npm install --ignore-scripts

      - name: Check backend syntax
        run: find Back -type f -name '*.mjs' -not -path '*/node_modules/*' -print0 | xargs -0 -n1 node --check

      - name: Validate agent capability contract
        working-directory: Back
        run: npm run validate:capabilities

      - name: Validate retention lifecycle
        working-directory: Back
        run: npm run validate:retention

      - name: Install frontend dependencies
        working-directory: Front
        run: npm install --ignore-scripts

      - name: Build frontend
        working-directory: Front
        run: npm run build
