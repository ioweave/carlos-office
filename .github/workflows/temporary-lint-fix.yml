name: Temporary Lint Fix

on:
  push:
    branches: [v1.1]
    paths:
      - .github/workflows/temporary-lint-fix.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
      - name: Install dependencies
        run: |
          npm --prefix Back ci
          npm --prefix Front ci
      - name: Apply safe lint fixes
        run: |
          npm --prefix Back run lint -- --fix || true
          npm --prefix Front run lint -- --fix || true
          python3 <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          helper = '''const hasInvalidFileNameCharacter = value => [...value].some(character => {
            const code = character.charCodeAt(0);
            return code < 32 || [34, 42, 47, 58, 60, 62, 63, 92, 124].includes(code);
          });
          '''

          replace(
              "Back/src/controllers/ProcessController.mjs",
              'const RESUMABLE_TASK_STATUSES = new Set(["blocked", "failed", "cancelled"]);\n',
              'const RESUMABLE_TASK_STATUSES = new Set(["blocked", "failed", "cancelled"]);\n' + helper,
          )
          replace(
              "Back/src/controllers/ProcessController.mjs",
              '/[<>:"/\\\\|?*\\u0000-\\u001F]/.test(value)',
              'hasInvalidFileNameCharacter(value)',
          )

          replace(
              "Back/src/controllers/ScheduleController.mjs",
              'const schedules = new Map();\n',
              'const schedules = new Map();\n' + helper,
          )
          replace(
              "Back/src/controllers/ScheduleController.mjs",
              '/[<>:"/\\\\|?*\\u0000-\\u001F]/.test(value)',
              'hasInvalidFileNameCharacter(value)',
          )
          replace(
              "Back/src/controllers/ScheduleController.mjs",
              '  lastRunAt: null,\n  nextRunAt: null,\n  ...structuredClone(stored),',
              '  nextRunAt: null,\n  ...structuredClone(stored),',
          )

          replace(
              "Back/src/lib/AtomicFile.mjs",
              '    try { await handle?.close(); } catch {}\n    try { await rm(temporary, { force: true }); } catch {}',
              '''    try { await handle?.close(); } catch (cleanupError) {
                console.warn("[atomic-file] Could not close temporary file.", {
                  path,
                  message: cleanupError instanceof Error ? cleanupError.message : String(cleanupError),
                });
              }
              try { await rm(temporary, { force: true }); } catch (cleanupError) {
                console.warn("[atomic-file] Could not remove temporary file.", {
                  path: temporary,
                  message: cleanupError instanceof Error ? cleanupError.message : String(cleanupError),
                });
              }''',
          )

          replace(
              "Back/src/services/DatabaseService.mjs",
              '    try { db.exec("ROLLBACK"); } catch {}',
              '''    try { db.exec("ROLLBACK"); } catch (rollbackError) {
                console.error("[database] Could not roll back failed initialization.", {
                  message: rollbackError instanceof Error ? rollbackError.message : String(rollbackError),
                });
              }''',
          )
          replace(
              "Back/src/services/ProviderRegistryService.mjs",
              '      try { db.exec("ROLLBACK"); } catch {}',
              '''      try { db.exec("ROLLBACK"); } catch (rollbackError) {
                  console.error("[providers] Could not roll back provider settings.", {
                    message: rollbackError instanceof Error ? rollbackError.message : String(rollbackError),
                  });
                }''',
          )

          replace(
              "Back/src/services/TaskExecutionService.mjs",
              '  taskId,\n  task,\n  input,',
              '  taskId,\n  _task,\n  input,',
          )

          operations = Path("Front/src/pages/OperationsPage.jsx")
          text = operations.read_text()
          start = text.find("const mapProgress = task => {")
          if start == -1:
              raise SystemExit("mapProgress block not found")
          end = text.find("\n\nfunction WorkflowInspector", start)
          if end == -1:
              raise SystemExit("WorkflowInspector boundary not found")
          operations.write_text(text[:start] + text[end + 2:])
          PY
      - name: Validate fixes
        run: |
          npm --prefix Back run lint
          npm --prefix Back run check
          npm --prefix Front run build
          npm --prefix Front run lint
      - name: Commit fixes
        run: |
          git config user.name "Carlos Office CI"
          git config user.email "actions@users.noreply.github.com"
          git add Back Front
          git diff --cached --quiet && exit 0
          git commit -m "Clean repository lint errors"
          git push origin HEAD:v1.1
